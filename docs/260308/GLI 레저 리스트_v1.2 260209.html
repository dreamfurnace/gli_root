                { id: 202, name: "Ocean Grill Bali", location: "Indonesia", rating: 4.9, price: "180,000", badge: "해산물", description: "갓 잡아 올린 신선한 해산물을 발리식 소스로 그릴링한 요리.", features: ["라이브 연주", "선셋 뷰"], image: "https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&q=80&w=1200" },

                { id: 205, name: "Sky Cloud Singapore", location: "Singapore", rating: 5, price: "250,000", badge: "파인다이닝", description: "싱가포르 도심 70층 높이에서 즐기는 유러피안 파인다이닝.", features: ["창가석 보장", "드레스 코드"], image: "https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&q=80&w=1200" },

                                <TabButton active={activeTab === 'restaurant'} onClick={() => { setActiveTab('restaurant'); closeAllModals(); }} icon="Utensils" label="레스토랑" desc="Fine Dining" />
                                <TabButton active={activeTab === 'package'} onClick={() => { setActiveTab('package'); closeAllModals(); }} icon="Sparkles" label="패키지" desc="Special Offers" />
                            </div>
                        </div>
                    </header>

                    {(activeTab === 'resort' || activeTab === 'restaurant' || activeTab === 'package') && (
                        <div className="max-w-7xl mx-auto px-6 w-full -mt-6 relative z-40">
                            <div className="bg-[#1e293b]/80 backdrop-blur-2xl border border-white/10 rounded-[2.5rem] p-4 shadow-2xl flex flex-col md:flex-row items-center gap-4">
                                <div className="flex-1 grid grid-cols-2 md:grid-cols-4 gap-4 w-full">
                                    <div className="filter-input-group px-4 border-r border-white/5">
                                        <label className="text-[9px] font-black text-[#38bdf8] uppercase tracking-widest">Date</label>
                                        <input 
                                            type="date" 
                                            value={resDate}
                                            onChange={(e) => setResDate(e.target.value)}
                                            className="bg-transparent border-none outline-none text-sm font-bold text-white w-full cursor-pointer"
                                        />
                                    </div>
                                    <div className="filter-input-group px-4 border-r border-white/5">
                                        <label className="text-[9px] font-black text-[#38bdf8] uppercase tracking-widest">Guests</label>
                                        <div className="flex items-center gap-3">
                                            <button onClick={() => setResGuests(Math.max(1, resGuests - 1))} className="text-slate-500 hover:text-white"><Icon name="Minus" size={14}/></button>
                                            <span className="text-sm font-bold min-w-[20px] text-center">{resGuests}명</span>
                                            <button onClick={() => setResGuests(Math.min(10, resGuests + 1))} className="text-slate-500 hover:text-white"><Icon name="Plus" size={14}/></button>
                                        </div>
                                    </div>
                                    {(activeTab === 'resort' || activeTab === 'package') ? (
                                        <div className="filter-input-group px-4 border-r border-white/5 col-span-2 md:col-span-1">
                                            <label className="text-[9px] font-black text-[#38bdf8] uppercase tracking-widest">Room Type</label>
                                            <select 
                                                value={resRoomType}
                                                onChange={(e) => setResRoomType(e.target.value)}
                                                className="bg-transparent border-none outline-none text-sm font-bold text-white w-full cursor-pointer appearance-none"
                                            >
                                                <option value="" className="bg-[#1e293b]">객실 선택</option>
                                                {roomTypes.map(t => <option key={t} value={t} className="bg-[#1e293b]">{t}</option>)}
                                            </select>
                                        </div>
                                    ) : (
                                        <div className="filter-input-group px-4 border-r border-white/5 col-span-2 md:col-span-1">
                                            <label className="text-[9px] font-black text-[#38bdf8] uppercase tracking-widest">Time</label>
                                            <select 
                                                value={resTime}
                                                onChange={(e) => setResTime(e.target.value)}
                                                className="bg-transparent border-none outline-none text-sm font-bold text-white w-full cursor-pointer appearance-none"
                                            >
                                                <option value="" className="bg-[#1e293b]">시간 선택</option>
                                                {timeSlots.map(t => <option key={t} value={t} className="bg-[#1e293b]">{t}</option>)}
                                            </select>
                                        </div>
                                    )}
                                    <div className="filter-input-group px-4">
                                        <label className="text-[9px] font-black text-[#38bdf8] uppercase tracking-widest">Location</label>
                                        <select 
                                            value={resLocation}
                                            onChange={(e) => setResLocation(e.target.value)}
                                            className="bg-transparent border-none outline-none text-sm font-bold text-white w-full cursor-pointer appearance-none"
                                        >
                                            {locations.map(loc => (
                                                <option key={loc.value} value={loc.value} className="bg-[#1e293b]">{loc.label}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>
                                <button className="bg-[#38bdf8] text-[#0f172a] px-8 py-3.5 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-white transition-all w-full md:w-auto shadow-lg shadow-sky-400/10">
                                    Search
                                </button>
                            </div>
                        </div>
                    )}

                    <main className="max-w-7xl mx-auto px-6 py-16 flex-grow w-full">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {getData().map(item => (
                                <div key={item.id} className="bg-[#1e293b]/20 rounded-[2.5rem] overflow-hidden border border-white/5 group hover:border-[#38bdf8]/40 transition-all duration-500 flex flex-col h-full shadow-lg">
                                    <div className="h-60 relative overflow-hidden">
                                        <img src={item.image} className="w-full h-full object-cover opacity-70 group-hover:scale-105 transition-transform duration-1000" alt={item.name} />
                                        <div className="absolute inset-0 bg-gradient-to-t from-[#1e293b] via-transparent to-transparent opacity-80"></div>
                                        <div className="absolute top-5 right-5">
                                            {item.badge && <span className="bg-[#38bdf8] text-[#0f172a] text-[9px] font-black px-3 py-1.5 rounded-lg uppercase tracking-widest shadow-xl">{item.badge}</span>}
                                        </div>
                                        <div className="absolute bottom-6 left-7">
                                            <h4 className="text-2xl font-black uppercase tracking-tight leading-tight">{item.name}</h4>
                                        </div>
                                    </div>
                                    <div className="p-7 flex-grow flex flex-col justify-between">
                                        <div className="space-y-4">
                                            <div className="flex items-center gap-1.5 text-slate-500 text-[10px] font-black uppercase tracking-widest">
                                                <Icon name="MapPin" size={14} className="text-[#38bdf8]" /> {item.location || item.category}
                                            </div>
                                            <p className="text-slate-400 text-sm line-clamp-2 leading-relaxed font-light">{item.description}</p>
                                        </div>
                                        <div className="pt-6 mt-6 border-t border-white/5 flex items-center justify-between">
                                            <div>
                                                <p className="text-[9px] text-slate-500 font-black uppercase tracking-tighter">EST. PRICE</p>
                                                <p className="text-2xl font-black text-[#38bdf8]">{item.price} <span className="text-xs font-bold text-slate-500">GLIL</span></p>
                                            </div>
                                            <button 
                                                onClick={() => { setSelectedItem(item); setIsReservationMode(false); }}
                                                className="bg-white/5 hover:bg-white hover:text-[#0f172a] px-6 py-3 rounded-2xl font-black text-[10px] uppercase tracking-widest transition-all border border-white/5"
                                            >
                                                DETAILS
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {selectedItem && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-[#0f172a]/95 backdrop-blur-xl" onClick={closeAllModals}></div>
                            <div className="bg-[#1e293b] w-full max-w-6xl h-[90vh] rounded-[3rem] overflow-hidden border border-white/10 relative z-10 flex flex-col shadow-2xl modal-animate">
                                
                                <div className="h-2/5 relative shrink-0">
                                    <img src={selectedItem.image} className="w-full h-full object-cover" alt={selectedItem.name} />
                                    <div className="absolute inset-0 bg-gradient-to-t from-[#1e293b] to-transparent"></div>
                                    <button onClick={closeAllModals} className="absolute top-8 right-8 text-white/70 hover:text-white transition-all bg-black/20 hover:bg-black/40 backdrop-blur-md p-3 rounded-2xl border border-white/10">
                                        <Icon name="X" size={24} />
                                    </button>
                                    <div className="absolute bottom-8 left-12 space-y-2">
                                        <h3 className="text-5xl font-black uppercase tracking-tighter leading-none">{selectedItem.name}</h3>
                                        <div className="flex items-center gap-2 text-slate-400 text-sm font-medium">
                                            <Icon name="MapPin" size={16} className="text-[#38bdf8]" /> {selectedItem.location || selectedItem.category}
                                        </div>
                                    </div>
                                </div>

                                <div className="flex-grow overflow-y-auto custom-scrollbar p-12 flex flex-col lg:flex-row gap-16">
                                    <div className="lg:w-2/3 space-y-12">
                                        <section className="space-y-4">
                                            <h4 className="text-xl font-bold text-white flex items-center gap-3">
                                                <span className="w-1.5 h-6 bg-[#38bdf8] rounded-full"></span> OVERVIEW
                                            </h4>
                                            <p className="text-slate-400 text-lg leading-relaxed font-light italic">
                                                {selectedItem.fullDescription || selectedItem.description}
                                            </p>
                                        </section>

                                        <section className="space-y-6">
                                            <h4 className="text-xl font-bold text-white flex items-center gap-3">
                                                <span className="w-1.5 h-6 bg-[#38bdf8] rounded-full"></span> KEY HIGHLIGHTS
                                            </h4>
                                            <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                                {(selectedItem.features || ["발렛 서비스", "웰컴 드링크", "Wi-Fi"]).map((feature, idx) => (
                                                    <div key={idx} className="bg-white/5 border border-white/5 p-5 rounded-2xl flex items-center gap-4">
                                                        <div className="bg-[#38bdf8]/10 p-3 rounded-xl text-[#38bdf8]"><Icon name="CheckCircle2" size={20} /></div>
                                                        <span className="text-sm font-bold text-slate-300">{feature}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </section>

                                        <section className="space-y-6">
                                            <h4 className="text-xl font-bold text-white flex items-center gap-3">
                                                <span className="w-1.5 h-6 bg-[#38bdf8] rounded-full"></span> 상세 안내
                                            </h4>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {generalInfo.map((info, idx) => (
                                                    <div key={idx} className="flex gap-4 p-5 rounded-2xl bg-white/[0.03] border border-white/5">
                                                        <div className="shrink-0 p-3 bg-white/5 rounded-xl text-[#38bdf8]">
                                                            <Icon name={info.icon} size={20} />
                                                        </div>
                                                        <div className="space-y-1">
                                                            <h5 className="text-[11px] font-black text-slate-500 uppercase tracking-widest">{info.title}</h5>
                                                            <p className="text-sm font-bold text-slate-200">{info.content}</p>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </section>

                                        <section className="space-y-6">
                                            <button 
                                                onClick={() => setShowMoreDetails(!showMoreDetails)}
                                                className="w-full flex items-center justify-between group p-6 rounded-3xl bg-white/5 border border-white/5 hover:border-[#38bdf8]/30 transition-all"
                                            >
                                                <div className="flex items-center gap-3">
                                                    <span className="w-1.5 h-6 bg-[#38bdf8] rounded-full"></span>
                                                    <h4 className="text-xl font-bold text-white">상세 정보 보기</h4>
                                                </div>
                                                <div className={`transition-transform duration-300 ${showMoreDetails ? 'rotate-180' : ''}`}>
                                                    <Icon name="ChevronDown" size={24} className="text-[#38bdf8]" />
                                                </div>
                                            </button>

                                            {showMoreDetails && (
                                                <div className="space-y-4 animate-fadeIn">
                                                    {commonPolicies.map((policy, idx) => (
                                                        <div key={idx} className="p-6 rounded-2xl bg-white/[0.02] border border-white/5 space-y-2">
                                                            <h5 className="text-sm font-black text-[#38bdf8] uppercase tracking-wider">{policy.title}</h5>
                                                            <p className="text-sm text-slate-400 leading-relaxed">{policy.content}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </section>
                                    </div>

                                    <div className="lg:w-1/3">
                                        <div className="bg-[#1e293b] border border-[#38bdf8]/20 rounded-3xl p-8 shadow-2xl sticky top-0 space-y-8">
                                            {!isReservationMode ? (
                                                <>
                                                    <div className="space-y-6">
                                                        <div className="flex items-center justify-between border-b border-white/5 pb-4">
                                                            <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Pricing Summary</p>
                                                            <div className="bg-[#38bdf8]/10 px-2 py-1 rounded text-[9px] font-black text-[#38bdf8] uppercase">Official Rate</div>
                                                        </div>
                                                        
                                                        {(() => {
                                                            const details = calculatePriceDetails(selectedItem.price);
                                                            return (
                                                                <div className="space-y-4">
                                                                    <div className="flex justify-between items-center text-sm">
                                                                        <span className="text-slate-400 font-medium">기본 요금</span>
                                                                        <span className="font-bold text-slate-200">{details.base} GLIL</span>
                                                                    </div>
                                                                    <div className="flex justify-between items-center text-sm">
                                                                        <span className="text-slate-400 font-medium">세금 (VAT 10%)</span>
                                                                        <span className="font-bold text-slate-200">+{details.tax} GLIL</span>
                                                                    </div>
                                                                    {activeTab === 'restaurant' && (
                                                                        <div className="flex justify-between items-center text-sm">
                                                                            <span className="text-slate-400 font-medium">봉사료 (Service)</span>
                                                                            <span className="font-bold text-slate-200">+{details.service} GLIL</span>
                                                                        </div>
                                                                    )}
                                                                    <div className="pt-6 border-t border-white/10 flex justify-between items-end">
                                                                        <div className="space-y-1">
                                                                            <p className="text-[9px] font-black text-[#38bdf8] uppercase tracking-widest">Total Amount</p>
                                                                            <span className="text-4xl font-black text-white tracking-tighter">{details.total}</span>
                                                                        </div>
                                                                        <span className="text-sm font-bold text-slate-500 pb-1">GLIL</span>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })()}
                                                    </div>

                                                    {activeTab !== 'shop' && (
                                                        <div className="bg-white/5 rounded-2xl p-4 space-y-4 border border-white/5">
                                                            <div className="flex flex-col gap-1.5">
                                                                <div className="flex items-center gap-2 text-slate-500 text-[10px] font-bold uppercase">
                                                                    <Icon name="Calendar" size={12} />
                                                                    <span>체크인 일정 변경</span>
                                                                </div>
                                                                <input 
                                                                    type="date" 
                                                                    value={resDate} 
                                                                    onChange={(e) => setResDate(e.target.value)}
                                                                    className="sidebar-date"
                                                                />
                                                            </div>

                                                            <div className="grid grid-cols-2 gap-3">
                                                                <div className="flex flex-col gap-1.5">
                                                                    <div className="flex items-center gap-2 text-slate-500 text-[10px] font-bold uppercase">
                                                                        <Icon name="Users" size={12} />
                                                                        <span>인원</span>
                                                                    </div>
                                                                    <div className="flex items-center justify-between bg-white/5 border border-white/10 rounded-lg p-1 px-2">
                                                                        <button onClick={() => setResGuests(Math.max(1, resGuests - 1))} className="text-slate-400 hover:text-white"><Icon name="Minus" size={12}/></button>
                                                                        <span className="text-xs font-bold">{resGuests}명</span>
                                                                        <button onClick={() => setResGuests(Math.min(10, resGuests + 1))} className="text-slate-400 hover:text-white"><Icon name="Plus" size={12}/></button>
                                                                    </div>
                                                                </div>

                                                                <div className="flex flex-col gap-1.5">
                                                                    <div className="flex items-center gap-2 text-slate-500 text-[10px] font-bold uppercase">
                                                                        <Icon name={activeTab === 'restaurant' ? 'Clock' : 'Key'} size={12} />
                                                                        <span>{activeTab === 'restaurant' ? '시간' : '타입'}</span>
                                                                    </div>
                                                                    <select 
                                                                        value={activeTab === 'restaurant' ? resTime : resRoomType}
                                                                        onChange={(e) => activeTab === 'restaurant' ? setResTime(e.target.value) : setResRoomType(e.target.value)}
                                                                        className="sidebar-select appearance-none"
                                                                    >
                                                                        <option value="">선택</option>
                                                                        {(activeTab === 'restaurant' ? timeSlots : roomTypes).map(t => (
                                                                            <option key={t} value={t} className="bg-[#1e293b]">{t}</option>
                                                                        ))}
                                                                    </select>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    )}

                                                    <button 
                                                        onClick={handleOrderClick}
                                                        className="w-full bg-[#38bdf8] text-[#0f172a] py-5 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-white transition-all shadow-xl shadow-sky-400/20 active:scale-[0.98]"
                                                    >
                                                        {(activeTab === 'restaurant' || activeTab === 'resort' || activeTab === 'package') ? 'CONFIRM & RESERVE' : 'ADD TO BASKET'}
                                                    </button>
                                                </>
                                            ) : (
                                                <div className="space-y-6">
                                                    <div className="flex items-center justify-between">
                                                        <h5 className="font-black text-lg tracking-tight">최종 예약 확인</h5>
                                                        <button onClick={() => setIsReservationMode(false)} className="text-slate-500 hover:text-white transition-colors">
                                                            <Icon name="ArrowLeft" size={18}/>
                                                        </button>
                                                    </div>
                                                    <div className="p-6 rounded-2xl bg-white/5 border border-white/5 space-y-4">
                                                        <div className="space-y-2 pb-4 border-b border-white/5">
                                                            <div className="flex justify-between text-xs">
                                                                <span className="text-slate-500">일정</span>
                                                                <span className="font-bold">{resDate} {resTime}</span>
                                                            </div>
                                                            <div className="flex justify-between text-xs">
                                                                <span className="text-slate-500">상세</span>
                                                                <span className="font-bold">{resGuests}명 / {resRoomType || '-'}</span>
                                                            </div>
                                                        </div>
                                                        <p className="text-xs text-slate-400 leading-relaxed text-center">
                                                            결제 후 예약이 확정되며, 예약 내역은 이메일 및 카카오톡으로 즉시 발송됩니다.
                                                        </p>
                                                        <div className="flex justify-between items-center text-lg font-black pt-4 border-t border-white/5">
                                                            <span>결제 총액</span>
                                                            <span className="text-[#38bdf8]">{calculatePriceDetails(selectedItem.price).total} GLIL</span>
                                                        </div>
                                                    </div>
                                                    <button onClick={handleReservationSubmit} className="w-full bg-[#38bdf8] text-[#0f172a] py-5 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-white shadow-xl shadow-sky-400/20 active:scale-[0.98]">
                                                        PAY NOW & FINISH
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="py-20 border-t border-white/5 text-center">
                        <div className="text-xl font-black tracking-tighter opacity-40 mb-4">G L I</div>
                        <p className="text-[9px] font-black text-slate-600 uppercase tracking-[0.5em]">© 2026 GLI Global Lifestyle. All rights reserved.</p>
                    </footer>
                </div>
            );
        };

        const TabButton = ({ active, icon, label, desc, onClick }) => (
            <button onClick={onClick} className={`group relative flex flex-col items-start gap-1 p-5 md:p-6 rounded-[2rem] transition-all duration-500 min-w-[140px] md:min-w-[170px] border ${active ? 'bg-[#1e293b] border-[#38bdf8]/50 scale-[1.05] z-10' : 'bg-white/[0.02] text-slate-500 border-white/5 hover:border-white/10'}`}>
                <div className={`mb-2 transition-all ${active ? 'text-[#38bdf8] scale-110' : 'text-slate-600'}`}><Icon name={icon} size={22} /></div>
                <div className="text-left">
                    <span className={`block text-[12px] md:text-[13px] font-bold ${active ? 'text-white' : 'text-slate-500'}`}>{label}</span>
                    <span className={`block text-[8px] font-black uppercase tracking-[0.15em] opacity-40 ${active ? 'text-[#38bdf8]' : 'text-slate-600'}`}>{desc}</span>
                </div>
            </button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
